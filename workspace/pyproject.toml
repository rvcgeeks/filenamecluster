[project]
name = "workspace"
version = "0.1.2"
description = "Run filenamecluster on a folder of files and build the event folders."
authors = [{ name = "Rajas Chavadekar", email = "rvchavadekar@gmail.com" }]
requires-python = ">=3.11"
dependencies = ["filenamecluster"]

[project.urls]
Readme = "../README.md"
Algorithm = "../docs/algorithm.md"
Architecture = "../docs/architecture.md"
Devops = "../docs/devops.md"
Changelog = "../docs/changelog.md"

[project.scripts]
stub = "stub:main"

[project.gui-scripts]
filenamecluster = "filenamecluster.ui.app:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "pytest-html>=4.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["src/stub.py"]

[tool.hatch.build.targets.wheel.sources]
"src" = ""

[tool.uv]
python-preference = "only-managed"

[tool.uv.sources]
filenamecluster = { path = "../filenamecluster", editable = true }

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
log_level = "WARNING"
addopts = [
    "--cov=src",
    "--cov-report=term-missing",
    "--cov-report=html:reports/coverage",
    "--cov-fail-under=80",
    "--html=reports/pytest.html",
    "--self-contained-html",
]
