[project]
name = "filenamecluster"
version = "0.1.1"
description = "Tkinter app that clusters camera-roll files into chronological events using the timestamp in each filename, or picture, video, or PDF creation metadata when the name has none."
authors = [{ name = "Rajas Chavadekar", email = "rvchavadekar@gmail.com" }]
requires-python = ">=3.11"
dependencies = []

[project.urls]
Readme = "../README.md"
Algorithm = "../docs/algorithm.md"
Architecture = "../docs/architecture.md"
Devops = "../docs/devops.md"
Changelog = "../docs/changelog.md"

[project.gui-scripts]
filenamecluster = "filenamecluster.ui.app:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "pytest-html>=4.1",
    "pyinstaller>=6.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/filenamecluster"]

[tool.hatch.build.targets.wheel.force-include]
"src/filenamecluster/ui/i18n/en.json" = "filenamecluster/ui/i18n/en.json"
"src/filenamecluster/ui/i18n/hi.json" = "filenamecluster/ui/i18n/hi.json"
"src/filenamecluster/ui/i18n/mr.json" = "filenamecluster/ui/i18n/mr.json"
"src/filenamecluster/ui/i18n/de.json" = "filenamecluster/ui/i18n/de.json"
"src/filenamecluster/ui/i18n/fr.json" = "filenamecluster/ui/i18n/fr.json"
"src/filenamecluster/ui/i18n/ja.json" = "filenamecluster/ui/i18n/ja.json"
"src/filenamecluster/ui/i18n/ko.json" = "filenamecluster/ui/i18n/ko.json"

[tool.uv]
python-preference = "only-managed"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = [
    "--cov=filenamecluster",
    "--cov-report=term-missing",
    "--cov-report=html:reports/coverage",
    "--cov-fail-under=80",
    "--html=reports/pytest.html",
    "--self-contained-html",
]

[tool.coverage.run]
source = ["filenamecluster"]
branch = false
