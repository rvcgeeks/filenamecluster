# Builds one PyInstaller program on Linux, Windows, and macOS.
# A tag named v* (for example v0.1.0) publishes those files on a GitHub
# Release, each with a direct download link. A manual run only stores
# Actions artifacts. Nothing is published to PyPI.

name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Check the tag matches the version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          set -euo pipefail
          version="$(sed -n 's/^version = "\(.*\)"$/\1/p' filenamecluster/pyproject.toml)"
          if [ "$GITHUB_REF_NAME" != "v${version}" ]; then
            echo "Tag ${GITHUB_REF_NAME} must be v${version}, the version in filenamecluster/pyproject.toml." >&2
            exit 1
          fi

      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          cache-dependency-glob: filenamecluster/uv.lock

      - name: Install Tk libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-6 libxext6 libxrender1 libxft2 libxss1

      - name: Install the project
        working-directory: filenamecluster
        run: uv sync --frozen --group dev

      - name: Check that this Python has Tk
        working-directory: filenamecluster
        run: uv run python -c "import tkinter"

      - name: Build the executable
        working-directory: filenamecluster
        run: uv run python build.py

      - name: Name the download
        id: bundle
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            version="$GITHUB_REF_NAME"
          else
            version="v$(sed -n 's/^version = "\(.*\)"$/\1/p' filenamecluster/pyproject.toml)"
          fi
          if [ "$RUNNER_OS" = "macOS" ]; then
            file="filenamecluster-${version}-macos.dmg"
            hdiutil create \
              -volname "filenamecluster" \
              -srcfolder "filenamecluster/dist/filenamecluster.app" \
              -ov \
              -format UDZO \
              "$file"
          elif [ "$RUNNER_OS" = "Linux" ]; then
            file="filenamecluster-${version}-linux"
            cp filenamecluster/dist/filenamecluster "$file"
            chmod +x "$file"
          else
            file="filenamecluster-${version}-windows.exe"
            cp filenamecluster/dist/filenamecluster.exe "$file"
          fi
          echo "file=${file}" >> "$GITHUB_OUTPUT"
          echo "name=$(basename "$file")" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.bundle.outputs.name }}
          path: ${{ steps.bundle.outputs.file }}
          if-no-files-found: error

  release:
    name: Publish release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create or update the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"
          base="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/download/${tag}"
          mkdir -p publish
          while IFS= read -r -d '' file; do
            cp "$file" "publish/$(basename "$file")"
          done < <(find artifacts -type f -print0)
          mapfile -t files < <(find publish -type f | sort)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "No release files were built." >&2
            exit 1
          fi
          {
            echo "File Name Cluster ${tag}."
            echo
            echo "## Downloads"
            echo
            for file in "${files[@]}"; do
              name="$(basename "$file")"
              case "$name" in
                *.exe) detail="Windows program." ;;
                *.dmg) detail="macOS disk image. Open it and run filenamecluster.app." ;;
                *-linux) detail="Linux program. Run chmod +x on the file before starting it." ;;
                *) detail="" ;;
              esac
              if [ -n "$detail" ]; then
                echo "- [${name}](${base}/${name}) — ${detail}"
              else
                echo "- [${name}](${base}/${name})"
              fi
            done
          } > notes.md
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "${files[@]}" --clobber
            gh release edit "$tag" --notes-file notes.md
          else
            gh release create "$tag" "${files[@]}" \
              --title "$tag" \
              --notes-file notes.md
          fi
